services:
  postgres:
    image: postgres:16-alpine
    container_name: book-agent-postgres
    environment:
      POSTGRES_DB: book_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
    image: book-agent:local
    container_name: book-agent-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      BOOK_AGENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/book_agent
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    image: book-agent:local
    container_name: book-agent-app
    restart: unless-stopped
    env_file: .env
    environment:
      BOOK_AGENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/book_agent
      BOOK_AGENT_EXPORT_ROOT: /app/artifacts/exports
    ports:
      - "58000:8000"
    volumes:
      - app_exports:/app/artifacts/exports
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  app_exports:
