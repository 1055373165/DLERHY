[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "book-agent"
version = "0.1.0"
description = "Long-document translation agent for English books to Chinese."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pymupdf>=1.27.2",
  "httpx>=0.28.1",
  "cryptography>=42.0,<46.0",
]

# Development tools live in a dependency group so a plain `uv sync` (which
# dev.sh and service.sh run) installs them; `uv sync --no-dev` for images.
[dependency-groups]
dev = [
  "opentelemetry-sdk>=1.30,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
book-agent = "book_agent.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/book_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Test modules and scripts put sys.path / os.environ setup before imports.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
